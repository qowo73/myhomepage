<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지?</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #fffbeb; /* 밝은 노란색 배경 */
            margin: 0;
            overflow-x: hidden;
        }

        /* 룰렛 캔버스 - 부드러운 회전을 위한 transition 제거 (JS에서 애니메이션 직접 제어) */
        #roulette-canvas {
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.15));
        }

        /* 룰렛 정중앙 화살표 */
        .arrow-down {
            width: 0; 
            height: 0; 
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid #ef4444; /* 빨간색 화살표 */
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
            z-index: 10;
        }

        /* 팝업 꽃가루 캔버스 */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
        }

        /* 토글 스위치 커스텀 스타일 */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #3b82f6;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #3b82f6;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col relative pb-10">

    <header class="text-center pt-8 pb-4">
        <h1 class="text-3xl md:text-5xl font-black text-slate-800 drop-shadow-sm mb-2">
            ⛅ 오늘 뭐 먹지? 🎲
        </h1>
    </header>

    <main class="flex-grow container mx-auto px-4 flex flex-col gap-6 max-w-5xl">
        
        <!-- 날씨 카드 -->
        <section class="bg-white rounded-2xl shadow-md p-5 border border-slate-100 relative overflow-hidden">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                
                <!-- 지역 선택 및 날씨 정보 -->
                <div class="flex items-center gap-4 w-full md:w-auto">
                    <div class="flex items-center gap-2 relative">
                        <button id="btn-current-location" class="p-2 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-xl transition-colors" title="현재 접속지역 날씨">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                        </button>
                        <input type="text" id="region-search" list="region-list" class="bg-slate-50 border border-slate-200 text-slate-700 font-bold py-2 px-3 rounded-xl focus:outline-none focus:border-blue-500 w-28 md:w-32 text-center shadow-sm placeholder-slate-400" placeholder="도시 검색">
                        <datalist id="region-list">
                            <!-- JS에서 렌더링 -->
                        </datalist>
                    </div>
                    <div id="weather-info" class="text-lg font-medium flex items-center gap-2">
                        <span class="text-slate-400 text-sm animate-pulse">날씨 불러오는 중...</span>
                    </div>
                </div>

                <!-- 규칙 토글 및 새로고침 -->
                <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-end">
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-bold text-slate-600">날씨 반영</span>
                        <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                            <input type="checkbox" name="toggle" id="weather-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-transform duration-300 ease-in-out border-slate-300" checked/>
                            <label for="weather-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-slate-300 cursor-pointer transition-colors duration-300 ease-in-out"></label>
                        </div>
                    </div>
                    <button id="btn-refresh-weather" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-full text-slate-600 transition-colors" title="날씨 새로고침">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                    </button>
                </div>
            </div>
            
            <!-- 적용 중인 규칙 표시 -->
            <div id="weather-rule-text" class="mt-3 text-center md:text-left text-sm md:text-base font-bold text-blue-600 bg-blue-50 py-2 px-4 rounded-lg">
                규칙을 계산 중입니다...
            </div>
            <!-- 오류 시 표시될 작은 텍스트 -->
            <p id="weather-error-text" class="text-xs text-red-400 mt-2 hidden"></p>
        </section>

        <div class="flex flex-col md:flex-row gap-6">
            
            <!-- 왼쪽: 메뉴 입력 및 리스트 -->
            <section class="w-full md:w-5/12 bg-white rounded-3xl shadow-lg p-6 flex flex-col border-2 border-slate-50 h-[550px]">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold flex items-center gap-2">🍽️ 메뉴 목록</h2>
                    <span id="menu-count" class="text-sm font-bold text-slate-500 bg-slate-100 px-3 py-1 rounded-full">6 / 10개</span>
                </div>

                <!-- 입력 영역 -->
                <div class="flex flex-col gap-2 mb-2">
                    <div class="flex gap-2">
                        <select id="menu-type" class="bg-slate-50 border border-slate-200 rounded-xl px-2 py-2 focus:outline-none focus:border-blue-500 font-medium">
                            <option value="warm">따뜻한 🔥</option>
                            <option value="cold">시원한 🧊</option>
                            <option value="any">상관없음 🍱</option>
                        </select>
                        <input type="text" id="menu-input" class="flex-grow border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all font-medium" placeholder="메뉴 이름">
                        <button id="btn-add" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-2 px-4 rounded-xl transition-colors disabled:opacity-50">추가</button>
                    </div>
                    <p id="input-message" class="text-sm text-red-500 font-medium h-5 pl-1"></p>
                </div>

                <!-- 메뉴 목록 리스트 -->
                <ul id="menu-list" class="flex-grow overflow-y-auto space-y-2 mb-4 pr-1">
                    <!-- Javascript로 렌더링됨 -->
                </ul>

                <button id="btn-clear-all" class="text-slate-500 hover:text-red-500 font-medium py-2 px-4 rounded-lg hover:bg-red-50 transition-colors self-end text-sm disabled:opacity-50">
                    전체 삭제
                </button>
            </section>

            <!-- 오른쪽: 룰렛 캔버스 및 시작 버튼 -->
            <section class="w-full md:w-7/12 bg-white rounded-3xl shadow-lg p-6 flex flex-col items-center border-2 border-slate-50 h-[550px] relative">
                
                <div class="relative flex flex-col items-center justify-center w-full max-w-[400px] aspect-square mb-6 mt-4">
                    <!-- 고정 화살표 -->
                    <div class="absolute -top-4 left-1/2 transform -translate-x-1/2 arrow-down z-20"></div>
                    
                    <!-- 룰렛 캔버스 -->
                    <div class="w-full h-full relative rounded-full overflow-hidden border-[6px] border-white shadow-inner bg-slate-50">
                        <canvas id="roulette-canvas" class="w-full h-full" style="transform-origin: center center;"></canvas>
                    </div>

                    <!-- 중앙 장식 -->
                    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-12 h-12 bg-white rounded-full border-[3px] border-slate-200 shadow-md z-10"></div>

                    <!-- 카운트다운 오버레이 -->
                    <div id="countdown-overlay" class="absolute inset-0 z-30 flex items-center justify-center hidden pointer-events-none">
                        <span id="countdown-text" class="text-[100px] font-black text-white drop-shadow-[0_4px_8px_rgba(0,0,0,0.6)]" style="-webkit-text-stroke: 3px #1e293b;">5</span>
                    </div>
                </div>

                <button id="btn-start" class="bg-blue-600 hover:bg-blue-700 text-white font-black text-2xl py-4 px-12 rounded-full shadow-[0_6px_0_0_#1d4ed8] active:shadow-[0_0px_0_0_#1d4ed8] active:translate-y-[6px] transition-all disabled:opacity-50 disabled:transform-none disabled:shadow-[0_6px_0_0_#1d4ed8] w-full max-w-sm">
                    🎯 룰렛 시작
                </button>
            </section>
        </div>

        <!-- 결과 기록 -->
        <section class="bg-white rounded-2xl shadow-sm p-5 border border-slate-100">
            <h3 class="text-md font-bold text-slate-700 mb-3 flex items-center gap-2">🕒 최근 결과</h3>
            <ul id="history-list" class="space-y-2 text-slate-600 text-sm">
                <li class="text-slate-400 italic">아직 기록이 없습니다.</li>
            </ul>
        </section>
    </main>

    <!-- 당첨 결과 모달 팝업 -->
    <div id="result-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[60] flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-[2rem] p-8 md:p-10 shadow-2xl flex flex-col items-center transform scale-95 transition-transform duration-300 max-w-sm w-full mx-4" id="result-modal-content">
            <span class="text-4xl mb-2">🎉</span>
            <h2 class="text-xl md:text-2xl font-bold text-slate-600 mb-2">오늘 점심은</h2>
            <div class="bg-yellow-100 text-yellow-800 text-3xl md:text-5xl font-black py-6 w-full rounded-2xl mb-4 border-2 border-yellow-300 shadow-inner text-center break-keep">
                "<span id="result-text"></span>"
            </div>
            <!-- 날씨 기반 추천 문구 -->
            <p id="result-context-text" class="text-sm font-bold text-blue-600 mb-6 text-center bg-blue-50 px-4 py-2 rounded-lg w-full"></p>
            
            <div class="flex gap-3 w-full">
                <button id="btn-retry" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl transition-colors">다시 돌리기</button>
                <button id="btn-close-modal" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-colors">닫기</button>
            </div>
        </div>
    </div>

    <!-- 팝업 파티클을 위한 캔버스 -->
    <canvas id="confetti-canvas"></canvas>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- 1. 설정 및 상태 변수 ---
            const REGIONS = [
                { name: '서울', nx: 60, ny: 127 },
                { name: '부산', nx: 98, ny: 76 },
                { name: '대구', nx: 89, ny: 90 },
                { name: '인천', nx: 55, ny: 124 },
                { name: '광주', nx: 58, ny: 74 },
                { name: '대전', nx: 67, ny: 100 },
                { name: '울산', nx: 102, ny: 84 },
                { name: '세종', nx: 66, ny: 103 },
                { name: '수원', nx: 60, ny: 121 },
                { name: '성남', nx: 63, ny: 124 },
                { name: '고양', nx: 57, ny: 128 },
                { name: '용인', nx: 62, ny: 121 },
                { name: '창원', nx: 90, ny: 77 },
                { name: '청주', nx: 69, ny: 107 },
                { name: '전주', nx: 63, ny: 89 },
                { name: '천안', nx: 63, ny: 112 },
                { name: '김해', nx: 95, ny: 77 },
                { name: '포항', nx: 102, ny: 94 },
                { name: '제주', nx: 52, ny: 38 },
                { name: '안동', nx: 91, ny: 106 },
                { name: '나주', nx: 57, ny: 71 },
                { name: '춘천', nx: 73, ny: 134 },
                { name: '강릉', nx: 92, ny: 131 },
                { name: '목포', nx: 50, ny: 67 },
                { name: '여수', nx: 73, ny: 66 }
            ];
            
            let menus = [
                { name: '김치찌개', type: 'warm' },
                { name: '칼국수', type: 'warm' },
                { name: '돈가스', type: 'any' },
                { name: '비빔밥', type: 'any' },
                { name: '냉면', type: 'cold' },
                { name: '메밀소바', type: 'cold' }
            ];
            const MAX_MENUS = 10;
            const MIN_MENUS = 2;

            let currentWeather = null; // KMA API에서 가져온 날씨 객체
            let currentRegion = null; // 현재 선택된 지역 객체
            let isSpinning = false;
            let currentRotation = 0;
            let historyData = [];

            // 룰렛 색상
            const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#1A535C', '#F7FFF7', '#FF9F1C', '#2EC4B6', '#E71D36', '#FDFFFC', '#011627'];
            const typeEmoji = { 'warm': '🔥', 'cold': '🧊', 'any': '🍱' };

            // --- 2. DOM 요소 선택 ---
            const regionSearch = document.getElementById('region-search');
            const regionList = document.getElementById('region-list');
            const btnCurrentLocation = document.getElementById('btn-current-location');
            const weatherInfo = document.getElementById('weather-info');
            const weatherToggle = document.getElementById('weather-toggle');
            const weatherRuleText = document.getElementById('weather-rule-text');
            const weatherErrorText = document.getElementById('weather-error-text');
            const btnRefreshWeather = document.getElementById('btn-refresh-weather');

            const menuInput = document.getElementById('menu-input');
            const menuType = document.getElementById('menu-type');
            const btnAdd = document.getElementById('btn-add');
            const inputMessage = document.getElementById('input-message');
            const menuList = document.getElementById('menu-list');
            const menuCountDisplay = document.getElementById('menu-count');
            const btnClearAll = document.getElementById('btn-clear-all');

            const canvas = document.getElementById('roulette-canvas');
            const ctx = canvas.getContext('2d');
            const btnStart = document.getElementById('btn-start');
            const countdownOverlay = document.getElementById('countdown-overlay');
            const countdownText = document.getElementById('countdown-text');

            const resultModal = document.getElementById('result-modal');
            const resultModalContent = document.getElementById('result-modal-content');
            const resultText = document.getElementById('result-text');
            const resultContextText = document.getElementById('result-context-text');
            const btnRetry = document.getElementById('btn-retry');
            const btnCloseModal = document.getElementById('btn-close-modal');
            const historyList = document.getElementById('history-list');

            // --- 기상청 LCC 격자 변환 함수 ---
            // GPS 위도/경도를 기상청 전용 격자(nx, ny)로 변환하는 공식입니다.
            function dfs_xy_conv(code, v1, v2) {
                const RE = 6371.00877; // 지구 반경(km)
                const GRID = 5.0; // 격자 간격(km)
                const SLAT1 = 30.0 * Math.PI / 180.0; // 투영 위도1(degree)
                const SLAT2 = 60.0 * Math.PI / 180.0; // 투영 위도2(degree)
                const OLON = 126.0 * Math.PI / 180.0; // 기준점 경도(degree)
                const OLAT = 38.0 * Math.PI / 180.0; // 기준점 위도(degree)
                const XO = 43; // 기준점 X좌표(GRID)
                const YO = 136; // 기1준점 Y좌표(GRID)

                const DEGRAD = Math.PI / 180.0;
                
                const re = RE / GRID;
                const slat1 = SLAT1;
                const slat2 = SLAT2;
                const olon = OLON;
                const olat = OLAT;

                let sn = Math.tan(Math.PI * 0.25 + slat2 * 0.5) / Math.tan(Math.PI * 0.25 + slat1 * 0.5);
                sn = Math.log(Math.cos(slat1) / Math.cos(slat2)) / Math.log(sn);
                let sf = Math.tan(Math.PI * 0.25 + slat1 * 0.5);
                sf = Math.pow(sf, sn) * Math.cos(slat1) / sn;
                let ro = Math.tan(Math.PI * 0.25 + olat * 0.5);
                ro = re * sf / Math.pow(ro, sn);
                let rs = {};
                
                if (code == "toXY") {
                    rs['lat'] = v1;
                    rs['lng'] = v2;
                    let ra = Math.tan(Math.PI * 0.25 + (v1) * DEGRAD * 0.5);
                    ra = re * sf / Math.pow(ra, sn);
                    let theta = v2 * DEGRAD - olon;
                    if (theta > Math.PI) theta -= 2.0 * Math.PI;
                    if (theta < -Math.PI) theta += 2.0 * Math.PI;
                    theta *= sn;
                    rs['x'] = Math.floor(ra * Math.sin(theta) + XO + 0.5);
                    rs['y'] = Math.floor(ro - ra * Math.cos(theta) + YO + 0.5);
                }
                return rs;
            }

            // --- 3. 초기화 함수 ---
            function init() {
                // 검색창 자동완성(datalist) 렌더링
                REGIONS.forEach((r) => {
                    const opt = document.createElement('option');
                    opt.value = r.name;
                    regionList.appendChild(opt);
                });

                resizeCanvas();
                updateMenuUI();

                // 페이지 로드 시 현재 접속 지역 기반으로 초기 설정
                currentRegion = REGIONS[0]; // 기본값: 서울
                regionSearch.value = "위치 확인 중...";
                
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const coords = dfs_xy_conv("toXY", position.coords.latitude, position.coords.longitude);
                            currentRegion = { name: '현재 위치', nx: coords.x, ny: coords.y };
                            regionSearch.value = currentRegion.name;
                            fetchWeather();
                        },
                        (error) => {
                            // 사용자가 권한을 거부했거나 실패한 경우 기본값 사용
                            regionSearch.value = currentRegion.name;
                            fetchWeather();
                        }
                    );
                } else {
                    regionSearch.value = currentRegion.name;
                    fetchWeather();
                }
            }

            // 창 크기 변경 시 캔버스 해상도 대응
            function resizeCanvas() {
                const size = canvas.parentElement.clientWidth;
                const dpr = window.devicePixelRatio || 1;
                canvas.width = size * dpr;
                canvas.height = size * dpr;
                ctx.scale(dpr, dpr);
                drawRoulette();
            }
            window.addEventListener('resize', resizeCanvas);

            // --- 4. 메뉴 리스트 및 룰렛 UI 업데이트 ---
            function updateMenuUI() {
                menuList.innerHTML = '';
                menus.forEach((menu, index) => {
                    const li = document.createElement('li');
                    li.className = 'flex justify-between items-center bg-slate-50 px-3 py-2 rounded-lg border border-slate-100 text-sm';
                    
                    const span = document.createElement('span');
                    span.className = 'font-bold text-slate-700 truncate mr-2 flex items-center gap-1';
                    span.textContent = menu.name;
                    // 타입 이모지 추가
                    const em = document.createElement('span');
                    em.textContent = typeEmoji[menu.type];
                    em.className = "text-xs";
                    span.appendChild(em);
                    
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'text-slate-400 hover:text-red-500 bg-white p-1.5 rounded transition-colors border border-slate-200';
                    deleteBtn.innerHTML = '❌';
                    deleteBtn.onclick = () => {
                        if (isSpinning) return;
                        menus.splice(index, 1);
                        updateMenuUI();
                    };

                    li.appendChild(span);
                    li.appendChild(deleteBtn);
                    menuList.appendChild(li);
                });

                menuCountDisplay.textContent = `현재 ${menus.length} / ${MAX_MENUS}개`;
                
                if (menus.length >= MAX_MENUS) {
                    menuInput.disabled = true;
                    btnAdd.disabled = true;
                    inputMessage.textContent = "메뉴는 최대 10개까지 입력할 수 있어요.";
                } else {
                    if (!isSpinning) {
                        menuInput.disabled = false;
                        btnAdd.disabled = false;
                    }
                    inputMessage.textContent = "";
                }

                drawRoulette();
            }

            // --- 5. 메뉴 입력 로직 ---
            function addMenu() {
                const name = menuInput.value.trim();
                const type = menuType.value;

                if (menus.length >= MAX_MENUS) return;
                
                if (!name) {
                    inputMessage.textContent = "메뉴 이름을 입력해 주세요.";
                    menuInput.focus();
                    return;
                }

                if (menus.some(m => m.name === name)) {
                    inputMessage.textContent = "이미 있는 메뉴예요.";
                    menuInput.focus();
                    return;
                }

                menus.push({ name, type });
                menuInput.value = '';
                updateMenuUI();
            }

            btnAdd.addEventListener('click', addMenu);
            menuInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addMenu();
            });
            menuInput.addEventListener('input', () => {
                if (menus.length < MAX_MENUS) inputMessage.textContent = "";
            });

            btnClearAll.addEventListener('click', () => {
                if (isSpinning) return;
                menus = [];
                updateMenuUI();
            });

            // --- 6. 날씨 조회 및 확률 계산 로직 ---
            function getWeatherEmoji(sky, pty) {
                if (pty !== "없음") {
                    if (pty.includes("눈") && pty.includes("비")) return "🌨️";
                    if (pty.includes("눈")) return "❄️";
                    return "🌧️";
                }
                if (sky === "맑음") return "☀️";
                if (sky === "구름많음") return "⛅";
                return "☁️";
            }

            function fetchWeather() {
                const target = currentRegion;
                
                weatherInfo.innerHTML = '<span class="text-slate-400 text-sm animate-pulse">날씨 불러오는 중...</span>';
                weatherRuleText.textContent = "날씨 정보를 확인하고 있습니다...";
                weatherRuleText.className = "mt-3 text-center md:text-left text-sm md:text-base font-bold text-slate-500 bg-slate-50 py-2 px-4 rounded-lg";
                weatherErrorText.classList.add('hidden');
                currentWeather = null;

                // Google Apps Script 서버 함수 호출
                if(typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler((res) => {
                            if (res.ok) {
                                currentWeather = res;
                                const emoji = getWeatherEmoji(res.하늘, res.강수형태);
                                weatherInfo.innerHTML = `
                                    <span class="text-2xl">${emoji}</span>
                                    <span>${res.기온}℃</span>
                                    <span class="text-sm font-normal text-slate-500">(${res.예보시각} 기준)</span>
                                `;
                                updateWeatherRule();
                            } else {
                                handleWeatherError(res.오류);
                            }
                        })
                        .withFailureHandler((error) => {
                            handleWeatherError(error.message);
                        })
                        .getWeather(target.nx, target.ny);
                } else {
                    // 외부 환경(미리보기 등)에서 실행될 경우의 Fallback
                    setTimeout(() => {
                        handleWeatherError("스크립트 실행 환경이 아닙니다. (google.script.run 없음)");
                    }, 1000);
                }
            }

            function handleWeatherError(errorMsg) {
                weatherInfo.innerHTML = '<span class="text-slate-400 text-sm">정보 없음</span>';
                weatherRuleText.textContent = "날씨 정보를 불러오지 못했어요. 날씨 없이 모든 메뉴 같은 확률로 룰렛을 돌립니다.";
                weatherRuleText.className = "mt-3 text-center md:text-left text-sm md:text-base font-bold text-slate-500 bg-slate-100 py-2 px-4 rounded-lg";
                
                weatherErrorText.textContent = `오류 상세: ${errorMsg}`;
                weatherErrorText.classList.remove('hidden');
            }

            function updateWeatherRule() {
                const useWeather = weatherToggle.checked;
                let text = "날씨 규칙이 꺼져 있습니다. 모든 메뉴 같은 확률로 돌립니다.";
                let theme = "bg-slate-100 text-slate-600";
                
                if (useWeather && currentWeather) {
                    const isRaining = currentWeather.강수형태 !== '없음';
                    const temp = currentWeather.기온;

                    if (isRaining) {
                        text = "비/눈 오는 날엔 따끈한 국물! 🔥 따뜻한 메뉴 확률 2배";
                        theme = "bg-blue-100 text-blue-700";
                    } else if (temp <= 10) {
                        text = "쌀쌀한 날씨엔 따끈한 음식! 🔥 따뜻한 메뉴 확률 2배";
                        theme = "bg-blue-100 text-blue-700";
                    } else if (temp >= 28) {
                        text = "더운 날엔 시원하게! 🧊 시원한 메뉴 확률 2배";
                        theme = "bg-red-50 text-red-600";
                    } else if (currentWeather.하늘 === '맑음' && temp >= 15 && temp <= 25) {
                        text = "산책하기 좋은 날! 조금 먼 식당도 좋아요 🚶 (모든 메뉴 확률 동일)";
                        theme = "bg-green-50 text-green-700";
                    } else {
                        text = "무난한 날씨! 모든 메뉴 같은 확률로 돌립니다.";
                        theme = "bg-slate-100 text-slate-700";
                    }
                }
                
                weatherRuleText.textContent = text;
                weatherRuleText.className = `mt-3 text-center md:text-left text-sm md:text-base font-bold py-2 px-4 rounded-lg transition-colors ${theme}`;
            }

            // 검색창에서 도시 이름을 입력 및 선택했을 때 처리
            regionSearch.addEventListener('change', (e) => {
                const searchName = e.target.value.trim();
                const found = REGIONS.find(r => r.name === searchName);
                if (found) {
                    currentRegion = found;
                    fetchWeather();
                } else {
                    // 목록에 없는 값이면 이전 상태로 복구
                    regionSearch.value = currentRegion.name;
                }
            });

            // 내 위치 버튼을 눌렀을 때 처리
            btnCurrentLocation.addEventListener('click', () => {
                regionSearch.value = "위치 확인 중...";
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const coords = dfs_xy_conv("toXY", position.coords.latitude, position.coords.longitude);
                            currentRegion = { name: '현재 위치', nx: coords.x, ny: coords.y };
                            regionSearch.value = currentRegion.name;
                            fetchWeather();
                        },
                        (error) => {
                            weatherErrorText.textContent = "오류 상세: 위치 권한이 거부되었거나 정보를 가져올 수 없습니다.";
                            weatherErrorText.classList.remove('hidden');
                            regionSearch.value = currentRegion.name;
                        }
                    );
                } else {
                    weatherErrorText.textContent = "오류 상세: 현재 브라우저에서 위치 기능을 지원하지 않습니다.";
                    weatherErrorText.classList.remove('hidden');
                    regionSearch.value = currentRegion.name;
                }
            });

            btnRefreshWeather.addEventListener('click', fetchWeather);
            weatherToggle.addEventListener('change', updateWeatherRule);

            // --- 7. 룰렛 캔버스 그리기 ---
            function drawRoulette() {
                const size = canvas.parentElement.clientWidth;
                const center = size / 2;
                const radius = size / 2;
                ctx.clearRect(0, 0, size, size);

                if (menus.length === 0) {
                    ctx.beginPath();
                    ctx.arc(center, center, radius, 0, 2 * Math.PI);
                    ctx.fillStyle = '#f8fafc';
                    ctx.fill();
                    ctx.fillStyle = '#94a3b8';
                    ctx.font = 'bold 18px "Noto Sans KR"';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('메뉴를 추가해주세요', center, center);
                    return;
                }

                const arc = (2 * Math.PI) / menus.length;

                for (let i = 0; i < menus.length; i++) {
                    const angle = i * arc;
                    
                    ctx.beginPath();
                    ctx.moveTo(center, center);
                    ctx.arc(center, center, radius, angle, angle + arc, false);
                    ctx.lineTo(center, center);
                    ctx.fillStyle = colors[i % colors.length];
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    // 텍스트 렌더링
                    ctx.save();
                    const textAngle = angle + arc / 2;
                    ctx.translate(center, center);
                    ctx.rotate(textAngle);
                    
                    ctx.fillStyle = '#ffffff';
                    if(['#FFE66D', '#F7FFF7', '#FDFFFC'].includes(colors[i % colors.length])) {
                        ctx.fillStyle = '#1e293b'; // 밝은 배경엔 어두운 글씨
                    }
                    ctx.font = 'bold 20px "Noto Sans KR"';
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'middle';
                    
                    let text = menus[i].name;
                    const maxWidth = radius * 0.7;
                    if(ctx.measureText(text).width > maxWidth) {
                        while(ctx.measureText(text + '..').width > maxWidth && text.length > 0) {
                            text = text.slice(0, -1);
                        }
                        text += '..';
                    }

                    ctx.shadowColor = "rgba(0,0,0,0.2)";
                    ctx.shadowBlur = 4;
                    ctx.fillText(text, radius - 20, 0);
                    ctx.restore();
                }
            }

            // 가중치 계산 함수 (날씨 반영)
            function getWeights() {
                let weights = menus.map(() => 1);
                
                if (weatherToggle.checked && currentWeather) {
                    const isRaining = currentWeather.강수형태 !== '없음';
                    const temp = currentWeather.기온;

                    if (isRaining || temp <= 10) {
                        menus.forEach((m, i) => { if (m.type === 'warm') weights[i] = 2; });
                    } else if (temp >= 28) {
                        menus.forEach((m, i) => { if (m.type === 'cold') weights[i] = 2; });
                    }
                }
                return weights;
            }

            // --- 8. 룰렛 회전 애니메이션 ---
            // Quartic ease out
            function easeOutQuart(t, b, c, d) {
                t /= d; t--;
                return -c * (t * t * t * t - 1) + b;
            }

            function setUIState(spinning) {
                isSpinning = spinning;
                menuInput.disabled = spinning || menus.length >= MAX_MENUS;
                btnAdd.disabled = spinning || menus.length >= MAX_MENUS;
                btnClearAll.disabled = spinning;
                btnStart.disabled = spinning;
                regionSearch.disabled = spinning;
                btnCurrentLocation.disabled = spinning;
                weatherToggle.disabled = spinning;
                
                const deleteBtns = menuList.querySelectorAll('button');
                deleteBtns.forEach(btn => btn.disabled = spinning);

                if (spinning) {
                    btnStart.textContent = '진행 중...';
                    btnStart.classList.replace('bg-blue-600', 'bg-slate-400');
                    btnStart.classList.replace('hover:bg-blue-700', 'hover:bg-slate-400');
                    btnStart.classList.replace('shadow-[0_6px_0_0_#1d4ed8]', 'shadow-none');
                } else {
                    btnStart.textContent = '🎯 룰렛 시작';
                    btnStart.classList.replace('bg-slate-400', 'bg-blue-600');
                    btnStart.classList.replace('hover:bg-slate-400', 'hover:bg-blue-700');
                    btnStart.classList.replace('shadow-none', 'shadow-[0_6px_0_0_#1d4ed8]');
                }
            }

            btnStart.addEventListener('click', () => {
                if (menus.length < MIN_MENUS) {
                    inputMessage.textContent = "메뉴를 2개 이상 입력해 주세요.";
                    return;
                }
                startSpinning();
            });

            function startSpinning() {
                setUIState(true);
                
                // 1. 가중치 기반 당첨자 선정
                const weights = getWeights();
                const totalWeight = weights.reduce((a, b) => a + b, 0);
                let randomVal = Math.random() * totalWeight;
                let winnerIndex = 0;
                for (let i = 0; i < weights.length; i++) {
                    randomVal -= weights[i];
                    if (randomVal <= 0) { winnerIndex = i; break; }
                }

                // 2. 목표 각도 계산
                const arcDegrees = 360 / menus.length;
                const startAngle = winnerIndex * arcDegrees;
                // 해당 조각의 중앙(±10% 여유) 범위 내의 랜덤한 각도를 화살표(-90도)에 맞춤
                const randomOffset = (arcDegrees * 0.1) + Math.random() * (arcDegrees * 0.8);
                const targetAngleOnCircle = startAngle + randomOffset;
                
                // 그려진 기준점(0도=3시)에서 12시방향(270도)으로 맞추기 위한 회전량
                let rotationNeeded = (270 - targetAngleOnCircle) % 360;
                if(rotationNeeded < 0) rotationNeeded += 360;

                const spins = 5; 
                const currentBase = Math.floor(currentRotation / 360) * 360;
                const targetRotation = currentBase + (360 * spins) + rotationNeeded;

                // 3. 애니메이션
                const duration = 5000;
                let startTime = null;
                const startRot = currentRotation;
                const rotationChange = targetRotation - startRot;

                countdownOverlay.classList.remove('hidden');

                function animate(currentTime) {
                    if (!startTime) startTime = currentTime;
                    const timeElapsed = currentTime - startTime;

                    if (timeElapsed < duration) {
                        currentRotation = easeOutQuart(timeElapsed, startRot, rotationChange, duration);
                        canvas.style.transform = `rotate(${currentRotation}deg)`;
                        
                        const secondsLeft = Math.ceil((duration - timeElapsed) / 1000);
                        if (secondsLeft > 0) countdownText.textContent = secondsLeft;

                        requestAnimationFrame(animate);
                    } else {
                        currentRotation = targetRotation;
                        canvas.style.transform = `rotate(${currentRotation}deg)`;
                        countdownOverlay.classList.add('hidden');
                        
                        showResult(menus[winnerIndex]);
                    }
                }
                requestAnimationFrame(animate);
            }

            // --- 9. 결과 표시 및 히스토리 ---
            function showResult(winningMenu) {
                resultText.textContent = winningMenu.name;
                
                // 날씨 추천 문구 (규칙이 켜져있고, 가중치가 2 적용된 경우만 텍스트 표시)
                const isWeatherApplied = weatherToggle.checked && currentWeather;
                const isRaining = isWeatherApplied && currentWeather.강수형태 !== '없음';
                const temp = isWeatherApplied ? currentWeather.기온 : null;
                
                if (isWeatherApplied && ((isRaining || temp <= 10) && winningMenu.type === 'warm')) {
                    resultContextText.textContent = "날씨가 쌀쌀/흐려 따끈한 국물 메뉴가 선택되었어요! 🔥";
                    resultContextText.classList.remove('hidden');
                } else if (isWeatherApplied && (temp >= 28 && winningMenu.type === 'cold')) {
                    resultContextText.textContent = "더운 날씨에 맞는 시원한 메뉴가 선택되었어요! 🧊";
                    resultContextText.classList.remove('hidden');
                } else {
                    resultContextText.classList.add('hidden');
                }
                
                resultModal.classList.remove('hidden');
                setTimeout(() => {
                    resultModal.classList.remove('opacity-0');
                    resultModalContent.classList.remove('scale-95');
                    resultModalContent.classList.add('scale-100');
                }, 10);

                startConfetti();
                addHistory(winningMenu.name);
            }

            function closeResultModal() {
                resultModal.classList.add('opacity-0');
                resultModalContent.classList.remove('scale-100');
                resultModalContent.classList.add('scale-95');
                
                setTimeout(() => {
                    resultModal.classList.add('hidden');
                    stopConfetti();
                    setUIState(false);
                }, 300);
            }

            btnRetry.addEventListener('click', () => {
                closeResultModal();
                setTimeout(startSpinning, 350);
            });
            btnCloseModal.addEventListener('click', closeResultModal);

            function addHistory(menuName) {
                const now = new Date();
                const timeString = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                
                let weatherString = "";
                if (currentWeather) {
                    const emoji = getWeatherEmoji(currentWeather.하늘, currentWeather.강수형태);
                    weatherString = `(${emoji} ${currentWeather.기온}℃)`;
                }

                historyData.unshift({ time: timeString, menu: menuName, weather: weatherString });
                if (historyData.length > 5) historyData.pop();

                renderHistory();
            }

            function renderHistory() {
                historyList.innerHTML = '';
                if (historyData.length === 0) {
                    historyList.innerHTML = '<li class="text-slate-400 italic">아직 기록이 없습니다.</li>';
                    return;
                }

                historyData.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.className = 'flex items-center';
                    if (index === 0) {
                        li.className += ' text-blue-600 font-bold';
                        li.innerHTML = `<span class="w-12 text-xs text-blue-400 mr-2">${item.time}</span> <span>- ${item.menu} <span class="text-xs ml-1 font-normal text-slate-500">${item.weather}</span></span>`;
                    } else {
                        li.className += ' text-slate-600';
                        li.innerHTML = `<span class="w-12 text-xs text-slate-400 mr-2">${item.time}</span> <span>- ${item.menu} <span class="text-xs ml-1 font-normal text-slate-400">${item.weather}</span></span>`;
                    }
                    historyList.appendChild(li);
                });
            }

            // --- 10. 꽃가루 효과 (Canvas) ---
            const cCanvas = document.getElementById('confetti-canvas');
            const cCtx = cCanvas.getContext('2d');
            let particles = [];
            let isConfettiRunning = false;

            function resizeConfetti() {
                cCanvas.width = window.innerWidth;
                cCanvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeConfetti);

            class Particle {
                constructor() {
                    this.x = window.innerWidth / 2;
                    this.y = window.innerHeight / 2;
                    this.r = Math.random() * 5 + 3;
                    this.dx = Math.random() * 24 - 12;
                    this.dy = Math.random() * -15 - 5;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.tilt = Math.floor(Math.random() * 10) - 10;
                    this.tiltAngleInc = (Math.random() * 0.07) + 0.05;
                    this.tiltAngle = 0;
                    this.gravity = 0.4;
                }
                draw() {
                    cCtx.beginPath();
                    cCtx.lineWidth = this.r;
                    cCtx.strokeStyle = this.color;
                    cCtx.moveTo(this.x + this.tilt + this.r, this.y);
                    cCtx.lineTo(this.x + this.tilt, this.y + this.tilt + this.r);
                    cCtx.stroke();
                }
                update() {
                    this.tiltAngle += this.tiltAngleInc;
                    this.dy += this.gravity;
                    this.x += this.dx;
                    this.y += this.dy;
                    this.tilt = Math.sin(this.tiltAngle) * 15;
                }
            }

            function startConfetti() {
                resizeConfetti();
                particles = Array.from({ length: 150 }, () => new Particle());
                isConfettiRunning = true;
                animateConfetti();
            }

            function animateConfetti() {
                if (!isConfettiRunning) return;
                requestAnimationFrame(animateConfetti);
                cCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

                let active = 0;
                particles.forEach(p => {
                    p.update();
                    p.draw();
                    if (p.y < window.innerHeight) active++;
                });

                if (active === 0) stopConfetti();
            }

            function stopConfetti() {
                isConfettiRunning = false;
                cCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            }

            init();
        });
    </script>
